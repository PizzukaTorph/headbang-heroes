name: Godot POC validation

on:
  push:
    branches:
      - develop-godot
  pull_request:
    branches:
      - develop-godot

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Run HH domain tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Run HH scene smoke test
        run: godot --headless --path . --script res://tests/scene_smoke.gd
